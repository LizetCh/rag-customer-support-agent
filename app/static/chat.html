<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth &amp; Crumb Bakery | Chat with us</title>
<style>
  :root {
    --cream: #FBF5EA;
    --crust: #4A2C17;
    --ember: #B84C19;
    --flour: #FFFDF8;
    --line: #E7DAC5;
    --muted: #6B5240;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #EFE4D2;
    color: var(--crust);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .chat {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    background: var(--cream);
    box-shadow: 0 0 32px rgb(74 44 23 / 18%);
  }
  header { padding: 16px 20px; background: var(--crust); color: var(--cream); }
  h1 { margin: 0; font: 600 1.45rem/1.2 Georgia, "Times New Roman", serif; }
  header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-top: 8px;
  }
  .bot { align-self: flex-start; background: var(--flour); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .customer { align-self: flex-end; background: var(--ember); color: #fff; border-bottom-right-radius: 4px; }
  .notice { border-color: var(--ember); }
  .tool { align-self: flex-start; margin-left: 6px; font-size: .78rem; color: var(--muted); }
  .tool::before { content: "\2022\00a0"; color: var(--ember); }
  .bubble p, .bubble ul { margin: 0; }
  .bubble p + p, .bubble p + ul, .bubble ul + p { margin-top: 8px; }
  .bubble ul { padding-left: 20px; }
  .bubble li + li { margin-top: 6px; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  footer { padding: 12px 16px 10px; border-top: 1px solid var(--line); background: var(--flour); }
  #suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  #suggestions button {
    padding: 4px 12px;
    font-size: .85rem;
    color: var(--crust);
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  form { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    font: inherit;
    color: var(--crust);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  #send { padding: 10px 20px; color: #fff; background: var(--ember); border: 0; border-radius: 999px; font-weight: 600; }
  small { display: block; margin-top: 8px; font-size: .74rem; color: var(--muted); text-align: center; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>Hearth &amp; Crumb Bakery</h1>
    <p>Portland, OR &middot; Bakery assistant</p>
  </header>

  <div id="messages" role="log" aria-live="polite">
    <div class="bubble bot">Hi! Ask me about our bread, hours, orders, or allergens.</div>
  </div>

  <footer>
    <div id="suggestions">
      <button type="button" data-message="What are your opening hours?">Opening hours</button>
      <button type="button" data-message="What's your return policy?">Return policy</button>
      <button type="button" data-message="Do you have any baguettes left?">Any baguettes?</button>
    </div>
    <form id="form">
      <label class="visually-hidden" for="input">Your message</label>
      <input id="input" maxlength="2000" autocomplete="off" placeholder="Type your message...">
      <button id="send" type="submit">Send</button>
    </form>
    <small>Fictitious demo bakery, so no person will reply. Please don't share personal information.</small>
  </footer>
</div>

<script>
  const TOOL_LABELS = {
    search_knowledge: "searched our documents",
    check_stock: "checked stock",
    handoff_to_human: "passed to a team member",
  };
  const QUOTA_MESSAGE = "Our assistant is resting. The demo runs on a free quota, please try again later.";
  const ERROR_MESSAGE = "Sorry, something went wrong. Please try sending that again.";
  const REQUEST_TIMEOUT_MS = 90000;

  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const buttons = document.querySelectorAll("button");

  // The server creates this on the first reply. A page reload starts a new chat.
  let sessionId = null;

  // All text goes through textContent, so a message can never run as HTML.
  function add(text, className) {
    const element = document.createElement("div");
    element.className = className;
    element.textContent = text;
    messages.append(element);
    messages.scrollTop = messages.scrollHeight;
    return element;
  }

  // Gemini sometimes replies with Markdown. Support only **bold** and bullet
  // lines, built as DOM elements: still no HTML parsing, so still no XSS.
  function appendInline(parent, text) {
    text.split(/\*\*(.+?)\*\*/).forEach((part, index) => {
      if (index % 2) parent.append(Object.assign(document.createElement("strong"), { textContent: part }));
      else parent.append(part);
    });
  }

  function addReply(text) {
    const bubble = add("", "bubble bot");
    let list = null;
    for (const line of text.split("\n")) {
      if (!line.trim()) continue;
      const bullet = line.match(/^\s*[*-]\s+(.*)$/);
      if (bullet) {
        list ??= bubble.appendChild(document.createElement("ul"));
        appendInline(list.appendChild(document.createElement("li")), bullet[1]);
      } else {
        list = null;
        appendInline(bubble.appendChild(document.createElement("p")), line);
      }
    }
    messages.scrollTop = messages.scrollHeight;
  }

  function setBusy(busy) {
    buttons.forEach((button) => { button.disabled = busy; });
  }

  async function send(text) {
    setBusy(true);
    input.value = "";
    add(text, "bubble customer");
    const waiting = add("Baking your answer", "bubble bot dots");

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
        signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
      });
      if (!response.ok) {
        add(response.status === 503 ? QUOTA_MESSAGE : ERROR_MESSAGE, "bubble bot notice");
        input.value = text;
        return;
      }
      const data = await response.json();
      sessionId = data.session_id;
      addReply(data.reply);
      // A turn can use the same tool twice; show its label once.
      new Set(data.tools_used).forEach((tool) => add(TOOL_LABELS[tool] ?? tool, "tool"));
    } catch {
      add(ERROR_MESSAGE, "bubble bot notice");
      input.value = text;
    } finally {
      waiting.remove();
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (text && !document.getElementById("send").disabled) send(text);
  });

  document.getElementById("suggestions").addEventListener("click", (event) => {
    const message = event.target.dataset.message;
    if (message) send(message);
  });
</script>
</body>
</html>
