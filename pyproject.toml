[project]
name = "bread-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
